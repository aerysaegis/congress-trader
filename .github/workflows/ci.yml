name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  offline:
    # The analysis path must never need the network or a broker SDK.
    # Steps that need the CLI are deferred until contract 05 lands rather than
    # failing every PR in the meantime -- a permanently red build teaches
    # everyone to ignore red builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Detect optional modules
        id: have
        run: |
          test -f congress_trader/__main__.py && echo "cli=true" >> "$GITHUB_OUTPUT" || {
            echo "cli=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLI not implemented yet (contract 05) - CLI checks deferred"
          }
          test -f congress_trader/broker.py && echo "broker=true" >> "$GITHUB_OUTPUT" || {
            echo "broker=false" >> "$GITHUB_OUTPUT"
            echo "::notice::broker not implemented yet (contract 04) - import check deferred"
          }

      - name: Engine scores offline
        # Real coverage today, with no CLI: the engine must produce signals
        # from the bundled fixture with no network and no credentials.
        run: |
          python3 - <<'PY'
          from datetime import date
          from congress_trader.config import Reference
          from congress_trader.normalize import normalize, window
          from congress_trader.sample_data import build_sample
          from congress_trader import signals

          asof = date(2025, 6, 30)
          ref = Reference.load()
          universe = normalize(build_sample(anchor=asof), reference=ref)
          assert universe.trades, "fixture produced no trades"
          assert universe.dropped, "no drop rules fired - the filters regressed"
          scored = signals.score(window(universe, lookback=60, asof=asof),
                                 reference=ref, lookback=60, asof=asof)
          assert scored, "no names cleared the members floor"
          assert not any(s.ticker == "WHAL" for s in scored), \
              "the single-member whale must not qualify"
          print(f"ok: {len(scored)} names scored, drops={universe.dropped}")
          PY

      - name: Broker imports without alpaca-py
        if: steps.have.outputs.broker == 'true'
        run: python3 -c "import congress_trader.broker"

      - name: Report runs offline
        if: steps.have.outputs.cli == 'true'
        run: python3 -m congress_trader report --sample

      - name: JSON output is valid
        if: steps.have.outputs.cli == 'true'
        run: python3 -m congress_trader report --sample --json | python3 -m json.tool > /dev/null

      - name: Dry run needs no credentials
        if: steps.have.outputs.cli == 'true'
        env:
          ALPACA_API_KEY: ""
          ALPACA_API_SECRET: ""
        run: python3 -m congress_trader run --dry-run --sample

  live-gate:
    # --live without --yes-really must place nothing and exit non-zero.
    #
    # A non-zero exit is NOT sufficient evidence the gate works: a missing
    # module, a syntax error or a bad flag all exit non-zero too. This job
    # therefore requires the output to name --yes-really, so it can only pass
    # because the gate actually fired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Live gate holds
        run: |
          if [ ! -f congress_trader/__main__.py ]; then
            echo "::notice::CLI not implemented yet (contract 05) - gate check deferred"
            exit 0
          fi
          set +e
          output=$(python3 -m congress_trader run --live --sample 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::--live succeeded without --yes-really. The gate is broken."
            exit 1
          fi
          if ! echo "$output" | grep -q -- "--yes-really"; then
            echo "::error::--live failed, but not because of the gate. The command must"
            echo "::error::refuse with a message naming --yes-really, so this check cannot"
            echo "::error::pass on an unrelated error such as an import failure."
            exit 1
          fi
          echo "gate held, and for the right reason"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials committed
        run: |
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env is tracked. Remove it and rotate the keys."; exit 1
          fi
          if git grep -nIE 'ALPACA_API_(KEY|SECRET)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9]{16,}' \
               -- . ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "::error::possible hardcoded credential"; exit 1
          fi
          echo "clean"

  macapp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI client
        run: |
          if [ ! -f macapp/Package.swift ]; then
            echo "macapp not implemented yet (contract 07) - skipping"; exit 0
          fi
          swift build --package-path macapp
